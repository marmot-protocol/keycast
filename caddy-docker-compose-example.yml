# Reverse proxy for a Keycast instance, using a static Caddyfile.
#
# This deliberately does NOT mount /var/run/docker.sock. A label-driven proxy
# needs the Docker API, and that API is root-equivalent on the host even when the
# socket is bind-mounted read-only: read-only applies to the socket file, not to
# the commands sent over it. Caddy is the only process that parses untrusted
# Internet traffic, so a compromise there would otherwise expose master.key, the
# database, and the signer. Keycast has two fixed upstreams, so nothing is lost.
#
# Setup:
#   cp Caddyfile.example Caddyfile      # then review it
#   docker network create --internal keycast   # scripts/init.sh does this
#   docker compose -f caddy-docker-compose-example.yml up -d
#
# Upgrading from an older root-owned Caddy proxy:
#   1. Update ./Caddyfile with http_port 8080, https_port 8443, the explicit
#      http://{$DOMAIN} redirect, and the 127.0.0.1:2020 /healthz block.
#   2. Stop Caddy and transfer caddy_data/caddy_config ownership to 10001:10001:
#      docker compose -f caddy-docker-compose-example.yml down
#      docker compose -f caddy-docker-compose-example.yml run --rm --user 0 \
#        --entrypoint sh caddy -c 'chown -R 10001:10001 /data /config'
#   3. Start Caddy again: docker compose -f caddy-docker-compose-example.yml up -d
#
# Verify the pinned digest before trusting it:
#   docker buildx imagetools inspect caddy:2.10-alpine

services:
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: keycast-caddy
    user: "10001:10001"
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    environment:
      DOMAIN: "${DOMAIN:?error}"
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # Reaches keycast-api and keycast-web on the internal network, and the
      # public network for ACME and published ports.
      - keycast
      - keycast-ingress
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    init: true
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
      nofile:
        soft: 8192
        hard: 8192
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2020/healthz"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s

networks:
  keycast:
    external: true
    name: keycast
  keycast-ingress:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
