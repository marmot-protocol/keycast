name: Release

on:
  push:
    tags:
      - 'v*'

# Serialize all registry mutations, including stable aliases.
concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish the verified release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
      packages: write
    steps:
      - name: Check out the version tag and master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/release.py publish "$GITHUB_REF_NAME"
